name: fyloxa
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  qr_flutter: ^4.1.0 
  font_awesome_flutter: ^10.7.0
  http: ^1.2.1
  shared_preferences: ^2.2.3
  flutter_secure_storage: ^9.2.2
  google_fonts: ^6.2.1
  rename_app: ^1.6.6
  flutter_launcher_icons: ^0.13.1
  geolocator: ^14.0.2
  geocoding: ^4.0.0
  flutter_dotenv: ^6.0.1
  flutter_bloc: ^9.1.1
  equatable: ^2.0.5 # Version downgraded to 2.0.5 for stability
  
  # Networking (Highly recommended over 'http' for Clean Architecture)
  dio: ^5.7.0 
  
  # Dependency Injection (Service Locator - Clean Architecture ke liye zaroori hai)
  get_it: ^8.0.3
  
  # Routing
  go_router: ^14.7.0

  # JSON Serialization (Manual parsing se bachne ke liye)
  json_annotation: ^4.9.0
  intl_phone_field: ^3.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # Code generation (JSON parsing automate karne ke liye)
  build_runner: ^2.4.9
  json_serializable: ^6.8.0

flutter:
  uses-material-design: true
  
  # Yahan maine aapka .env aur icons folder add kar diya hai
  assets:
    - .env
    - assets/icon/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/Fyloxa_admin.jpg"